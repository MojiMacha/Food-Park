<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สั่งอาหาร | QR Restaurant</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="topbar">
  <div><b>🍽️ QR Restaurant</b><span id="tableBadge" class="badge"></span></div>
  <button class="cart-btn" id="cartBtn">🛒 <span id="cartCount">0</span></button>
</header>

<main class="customer-main">
  <section class="hero">
    <h1>วันนี้รับอะไรดี? 😋</h1>
    <p>เลือกอาหารและเครื่องดื่ม แล้วส่งออเดอร์เข้าครัวได้เลย</p>
  </section>
  <div class="tabs" id="tabs"></div>
  <div class="menu-grid" id="menuGrid"></div>
</main>

<div class="drawer hidden" id="drawer">
  <div class="drawer-panel">
    <div class="drawer-head"><h2>🛒 ตะกร้าของฉัน</h2><button id="closeCart">✕</button></div>
    <div id="cartItems"></div>
    <div class="total">รวมทั้งหมด <b id="totalPrice">฿0</b></div>
    <button class="primary full" id="checkoutBtn">ยืนยันออเดอร์</button>
  </div>
</div>

<div class="modal hidden" id="noteModal">
  <div class="modal-card">
    <h2 id="noteTitle">หมายเหตุ</h2>
    <textarea id="itemNote" placeholder="เช่น ไม่เผ็ด, ไม่ใส่ผัก"></textarea>
    <div class="row"><button id="cancelNote">ยกเลิก</button><button class="primary" id="saveNote">เพิ่มลงตะกร้า</button></div>
  </div>
</div>

<script type="module" src="assets/js/customer.js"></script>
</body></html>
