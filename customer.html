<style>


    /* =========================
       ROOT
    ========================= */

    :root {

        --primary: #ff4f81;

        --primary-dark: #e63768;

        --secondary: #ff9f43;

        --dark: #221820;

        --text: #443a42;

        --muted: #8c838b;

        --background: #fff7fa;

        --white: #ffffff;

    }


    /* =========================
       RESET
    ========================= */

    * {

        margin: 0;

        padding: 0;

        box-sizing: border-box;

    }


    body {

        font-family:

            "Kanit",

            sans-serif;

        background:

            radial-gradient(
                circle at top left,
                #ffe4ee,
                transparent 30%
            ),

            #fff7fa;

        color:

            var(--text);

        min-height: 100vh;

        padding-bottom: 100px;

    }


    button {

        font-family: inherit;

        cursor: pointer;

    }


    /* =========================
       NAVBAR
    ========================= */

    .navbar {

        position: sticky;

        top: 0;

        z-index: 100;

        background:

            rgba(
                255,
                255,
                255,
                0.85
            );

        backdrop-filter:

            blur(20px);

        border-bottom:

            1px solid

            rgba(
                0,
                0,
                0,
                0.05
            );

        padding:

            14px

            5%;

    }


    .navbar-inner {

        max-width: 1250px;

        margin: auto;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 15px;

    }


    .brand {

        display: flex;

        align-items: center;

        gap: 10px;

    }


    .brand-icon {

        width: 45px;

        height: 45px;

        border-radius: 15px;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 23px;

        background:

            linear-gradient(
                135deg,
                #ff4f81,
                #ff9367
            );

        box-shadow:

            0 10px 20px

            rgba(
                255,
                79,
                129,
                0.25
            );

    }


    .brand h1 {

        font-size: 20px;

        color: var(--dark);

    }


    .table-badge {

        display: inline-flex;

        align-items: center;

        gap: 5px;

        padding:

            7px

            12px;

        background:

            #fff0f5;

        color:

            var(--primary-dark);

        border-radius: 50px;

        font-size: 13px;

        font-weight: 500;

    }


    /* =========================
       CART BUTTON
    ========================= */

    .cart-button {

        position: relative;

        width: 50px;

        height: 50px;

        border: none;

        border-radius: 16px;

        background:

            linear-gradient(
                135deg,
                #ff4f81,
                #ff7b62
            );

        color: white;

        font-size: 22px;

        box-shadow:

            0 10px 25px

            rgba(
                255,
                79,
                129,
                0.3
            );

        transition:

            0.25s;

    }


    .cart-button:hover {

        transform:

            translateY(-2px);

    }


    .cart-count {

        position: absolute;

        top: -7px;

        right: -7px;

        min-width: 22px;

        height: 22px;

        padding: 0 5px;

        border-radius: 50px;

        background: var(--dark);

        color: white;

        font-size: 11px;

        display: flex;

        align-items: center;

        justify-content: center;

        border:

            2px solid white;

    }


    /* =========================
       MAIN
    ========================= */

    .container {

        max-width: 1250px;

        margin: auto;

        padding:

            35px

            5%;

    }


    /* =========================
       HERO
    ========================= */

    .hero {

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 30px;

        margin-bottom: 30px;

    }


    .hero-text h2 {

        font-size:

            clamp(
                30px,
                4vw,
                48px
            );

        color: var(--dark);

        line-height: 1.1;

    }


    .hero-text h2 span {

        background:

            linear-gradient(
                90deg,
                #ff4f81,
                #ff7b62
            );

        -webkit-background-clip:

            text;

        -webkit-text-fill-color:

            transparent;

    }


    .hero-text p {

        margin-top: 8px;

        color: var(--muted);

        font-size: 16px;

    }


    /* =========================
       SEARCH
    ========================= */

    .search-box {

        position: relative;

        margin-bottom: 25px;

    }


    .search-icon {

        position: absolute;

        left: 18px;

        top: 50%;

        transform:

            translateY(-50%);

        font-size: 18px;

    }


    .search-input {

        width: 100%;

        border: none;

        outline: none;

        padding:

            16px

            20px

            16px

            50px;

        border-radius: 18px;

        background:

            rgba(
                255,
                255,
                255,
                0.85
            );

        box-shadow:

            0 10px 30px

            rgba(
                0,
                0,
                0,
                0.05
            );

        font-size: 15px;

        font-family: inherit;

    }


    /* =========================
       CATEGORY
    ========================= */

    .category-wrapper {

        display: flex;

        gap: 10px;

        overflow-x: auto;

        padding-bottom: 8px;

        margin-bottom: 28px;

        scrollbar-width: none;

    }


    .category-wrapper::-webkit-scrollbar {

        display: none;

    }


    .category-btn {

        white-space: nowrap;

        border: none;

        padding:

            11px

            18px;

        border-radius: 50px;

        background: white;

        color: var(--muted);

        box-shadow:

            0 5px 15px

            rgba(
                0,
                0,
                0,
                0.05
            );

        transition:

            0.25s;

    }


    .category-btn.active {

        background:

            linear-gradient(
                90deg,
                #ff4f81,
                #ff7b62
            );

        color: white;

        box-shadow:

            0 8px 20px

            rgba(
                255,
                79,
                129,
                0.25
            );

    }


    /* =========================
       MENU GRID
    ========================= */

    .menu-grid {

        display: grid;

        grid-template-columns:

            repeat(
                auto-fill,
                minmax(
                    230px,
                    1fr
                )
            );

        gap: 20px;

    }


    /* =========================
       FOOD CARD
    ========================= */

    .food-card {

        background:

            rgba(
                255,
                255,
                255,
                0.9
            );

        border-radius: 22px;

        overflow: hidden;

        box-shadow:

            0 10px 30px

            rgba(
                0,
                0,
                0,
                0.06
            );

        transition:

            0.3s;

        animation:

            fadeUp

            0.5s

            ease;

    }


    .food-card:hover {

        transform:

            translateY(-6px);

        box-shadow:

            0 20px 40px

            rgba(
                0,
                0,
                0,
                0.1
            );

    }


    .food-image {

        width: 100%;

        height: 180px;

        object-fit: cover;

        display: block;

    }


    .food-content {

        padding: 16px;

    }


    .food-category {

        font-size: 12px;

        color:

            var(--primary);

        font-weight: 500;

    }


    .food-name {

        margin-top: 4px;

        font-size: 18px;

        color: var(--dark);

    }


    .food-bottom {

        display: flex;

        align-items: center;

        justify-content: space-between;

        margin-top: 16px;

    }


    .food-price {

        font-size: 19px;

        font-weight: 700;

        color:

            var(--primary-dark);

    }


    .add-btn {

        width: 42px;

        height: 42px;

        border: none;

        border-radius: 14px;

        background:

            linear-gradient(
                135deg,
                #ff4f81,
                #ff7b62
            );

        color: white;

        font-size: 23px;

        box-shadow:

            0 7px 15px

            rgba(
                255,
                79,
                129,
                0.25
            );

        transition:

            0.2s;

    }


    .add-btn:hover {

        transform:

            scale(
                1.08
            );

    }


    /* =========================
       CART DRAWER
    ========================= */

    .drawer {

        position: fixed;

        inset: 0;

        background:

            rgba(
                0,
                0,
                0,
                0.45
            );

        z-index: 500;

        opacity: 1;

        transition:

            0.3s;

    }


    .drawer.hidden {

        opacity: 0;

        pointer-events: none;

    }


    .drawer-panel {

        position: absolute;

        top: 0;

        right: 0;

        width:

            min(
                430px,
                100%
            );

        height: 100%;

        background: white;

        display: flex;

        flex-direction: column;

        box-shadow:

            -20px 0 50px

            rgba(
                0,
                0,
                0,
                0.15
            );

    }


    .drawer-header {

        padding: 22px;

        display: flex;

        justify-content: space-between;

        align-items: center;

        border-bottom:

            1px solid

            #f0f0f0;

    }


    .drawer-header h2 {

        font-size: 22px;

    }


    .close-btn {

        width: 40px;

        height: 40px;

        border: none;

        border-radius: 12px;

        background:

            #fff0f5;

        color:

            var(--primary-dark);

    }


    .cart-items {

        flex: 1;

        overflow-y: auto;

        padding: 10px 22px;

    }


    .cart-item {

        padding:

            16px

            0;

        border-bottom:

    }


    .cart-item-top {

        display: flex;

    }


    .quantity-control {

        align-items: center;

        gap: 10px;

        margin-top: 12px;

    }


    .quantity-control button {

        width: 32px;

        height: 32px;

        border: none;

        border-radius: 10px;

        background:

            #fff0f5;

        color:

            var(--primary-dark);

        font-size: 18px;

    }


    /* =========================
       DRAWER FOOTER
    ========================= */

    .drawer-footer {

        padding: 22px;

        border-top:

            1px solid

            #f0f0f0;

        background: white;

    }


    .total-row {

        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 15px;

    }


    .total-price {

        font-size: 23px;

        font-weight: 700;

        color:

    }


    .checkout-btn {

        width: 100%;

        border: none;

        border-radius: 16px;

        padding: 16px;

        font-size: 16px;

        font-weight: 600;

        color: white;

        background:

            linear-gradient(
                90deg,
                #ff4f81,
                #ff7b62
            );

        box-shadow:

            0 10px 25px

            rgba(
                255,
                79,
                129,
                0.25
            );

    }


    /* =========================
       MODAL
    ========================= */

    .modal {

        position: fixed;

        inset: 0;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 20px;

        background:

            rgba(
                0,
                0,
                0,
                0.45
            );

        z-index: 600;

    }


    .modal.hidden {

        display: none;

    }


    .modal-card {

        width: 100%;

        max-width: 430px;

        padding: 25px;

        border-radius: 25px;

        background: white;

        animation:

            modalIn

            0.25s

            ease;

    }


    .modal-card h2 {

        font-size: 22px;

    }


    .modal-card p {

        margin-top: 5px;

        color: var(--muted);

        font-size: 14px;

    }


    .note-input {

        width: 100%;

        margin-top: 15px;

        min-height: 110px;

        resize: vertical;

        border:

            1px solid

            #eee;

        border-radius: 16px;

        padding: 13px;

        font-family: inherit;

        outline: none;

    }


    .modal-actions {

        display: flex;

        gap: 10px;

        margin-top: 18px;

    }


    .cancel-btn {

        flex: 1;

        border: none;

        border-radius: 14px;

        padding: 13px;

        background:

            #f5f5f5;

        color: var(--text);

    }


    .save-btn {

        flex: 2;

        border: none;

        border-radius: 14px;

        padding: 13px;

        background:

            linear-gradient(
                90deg,
                #ff4f81,
                #ff7b62
            );

        color: white;

        font-weight: 600;

    }


    /* =========================
       EMPTY STATE
    ========================= */

    .empty {

        text-align: center;

        padding: 50px 20px;

        color: var(--muted);

    }


    .empty-icon {

        font-size: 50px;

        margin-bottom: 10px;

    }


    /* =========================
       ANIMATION
    ========================= */

    @keyframes fadeUp {

        from {

            opacity: 0;

            transform:

                translateY(20px);

        }


        to {

            opacity: 1;

            transform:

                translateY(0);

        }

    }


    @keyframes modalIn {

        from {

            opacity: 0;

            transform:

                scale(
                    0.95
                );

        }


        to {

            opacity: 1;

            transform:

                scale(
                    1
                );

        }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (
        max-width: 650px
    ) {


        .navbar {

            padding:

                12px

                15px;

        }


        .brand h1 {

            font-size: 17px;

        }


        .brand-icon {

            width: 40px;

            height: 40px;

            border-radius: 13px;

        }


        .container {

            padding:

                25px

                15px;

        }


        .hero {

            display: block;

        }


        .hero-text h2 {

            font-size: 32px;

        }


        .hero-text p {

            font-size: 14px;

        }


        .menu-grid {

            grid-template-columns:

                repeat(
                    2,
                    1fr
                );

            gap: 12px;

        }


        .food-card {

            border-radius: 18px;

        }


        .food-image {

            height: 125px;

        }


        .food-content {

            padding: 12px;

        }


        .food-name {

            font-size: 15px;

            line-height: 1.3;

        }


        .food-price {

            font-size: 16px;

        }


        .add-btn {

            width: 36px;

            height: 36px;

            border-radius: 11px;

            font-size: 19px;

        }


        .table-badge {

            font-size: 11px;

        }

    }


</style>
```

<!-- =========================

<script type="module">

    import {

        menu

    }

    from

    "./assets/js/menu-data.js";


    import {

        db

    }

    from

    "./assets/js/firebase.js";


    import {

        collection,

        addDoc,

        serverTimestamp

    }

    from

    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



    /* =========================
       TABLE
    ========================== */

    const

        params

        =

        new URLSearchParams(
            window.location.search
        );


    const

        table

        =

        params.get(
            "table"
        )

        ||

        "ทดลอง";


    document.getElementById(
        "tableBadge"
    ).textContent

        =

        `🪑 โต๊ะ ${table}`;



    /* =========================
       CART
    ========================== */

    const

        cartKey

        =

        `restaurant_cart_${table}`;


    let

        cart

        =

        JSON.parse(

            localStorage.getItem(
                cartKey
            )

            ||

            "[]"

        );


    let

        selectedItem

        =

        null;


    let

        activeCategory

        =

        "ทั้งหมด";


    let

        searchText

        =

        "";



    /* =========================
       MONEY
    ========================== */

    function

    money(
        value
    )

    {

        return

            "฿"

            +

            value.toLocaleString(
                "th-TH"
            );

    }



    /* =========================
       CATEGORIES
    ========================== */

    const

        categories

        =

        [

            "ทั้งหมด",

            ...new Set(

                menu.map(

                    item

                    =>

                    item.cat

                )

            )

        ];



    function

    renderCategories()

    {

        document.getElementById(
            "tabs"
        ).innerHTML

            =

            categories.map(

                category

                =>

                `

                <button

                    class="category-btn

                    ${

                        category

                        ===

                        activeCategory

                        ?

                        "active"

                        :

                        ""

                    }"

                    data-category="${category}"

                >

                    ${category}

                </button>

                `

            )

            .join(
                ""
            );



        document

            .querySelectorAll(
                ".category-btn"
            )

            .forEach(

                button

                =>

                {

                    button.onclick

                        =

                        () =>

                        {

                            activeCategory

                                =

                                button.dataset.category;


                            renderCategories();


                            renderMenu();

                        };

                }

            );

    }



    /* =========================
       MENU
    ========================== */

    function

    renderMenu()

    {

        const

            filtered

            =

            menu.filter(

                item

                =>

                {

                    const

                        matchCategory

                        =

                        activeCategory

                        ===

                        "ทั้งหมด"

                        ||

                        item.cat

                        ===

                        activeCategory;


                    const

                        matchSearch

                        =

                        item.name

                        .toLowerCase()

                        .includes(

                            searchText

                            .toLowerCase()

                        );


                    return

                        matchCategory

                        &&

                        matchSearch;

                }

            );


        const

            menuGrid

            =

            document.getElementById(
                "menuGrid"
            );


        if (

            filtered.length

            ===

            0

        )

        {

            menuGrid.innerHTML

                =

                `

                <div class="empty">

                    <div class="empty-icon">

                        🔍

                    </div>

                    <h3>

                        ไม่พบเมนู

                    </h3>

                    <p>

                        ลองค้นหาด้วยคำอื่น

                    </p>

                </div>

                `;


            return;

        }


        menuGrid.innerHTML

            =

            filtered.map(

                item

                =>

                `

                <article class="food-card">


                    <img

                        src="${item.img}"

                        class="food-image"

                        alt="${item.name}"

                        loading="lazy"

                    >


                    <div class="food-content">


                        <span class="food-category">

                            ${item.cat}

                        </span>


                        <h3 class="food-name">

                            ${item.name}

                        </h3>


                        <div class="food-bottom">


                            <span class="food-price">

                                ${money(
                                    item.price
                                )}

                            </span>


                            <button

                                class="add-btn"

                                data-id="${item.id}"

                                title="เพิ่มลงตะกร้า"

                            >

                                +

                            </button>


                        </div>


                    </div>


                </article>

                `

            )

            .join(
                ""
            );


        document

            .querySelectorAll(
                ".add-btn"
            )

            .forEach(

                button

                =>

                {

                    button.onclick

                        =

                        () =>

                        {

                            const

                                item

                                =

                                menu.find(

                                    menuItem

                                    =>

                                    menuItem.id

                                    ===

                                    button.dataset.id

                                );


                            openNoteModal(
                                item
                            );

                        };

                }

            );

    }



    /* =========================
       SEARCH
    ========================== */

    document.getElementById(
        "searchInput"
    )

    .addEventListener(

        "input",

        event

        =>

        {

            searchText

                =

                event.target.value;


            renderMenu();

        }

    );



    /* =========================
       NOTE MODAL
    ========================== */

    function

    openNoteModal(
        item
    )

    {

        selectedItem

            =

            item;


        document.getElementById(
            "noteTitle"
        ).textContent

            =

            `➕ ${item.name}`;


        document.getElementById(
            "itemNote"
        ).value

            =

            "";


        document.getElementById(
            "noteModal"
        ).classList.remove(
            "hidden"
        );

    }



    document.getElementById(
        "cancelNote"
    ).onclick

        =

        () =>

        {

            document.getElementById(
                "noteModal"
            ).classList.add(
                "hidden"
            );

        };



    document.getElementById(
        "saveNote"
    ).onclick

        =

        () =>

        {

            const

                note

                =

                document.getElementById(
                    "itemNote"
                )

                .value

                .trim();


            const

                existingItem

                =

                cart.find(

                    item

                    =>

                    item.id

                    ===

                    selectedItem.id

                    &&

                    item.note

                    ===

                    note

                );


            if (

                existingItem

            )

            {

                existingItem.qty

                    +=

                    1;

            }

            else

            {

                cart.push(

                    {

                        ...selectedItem,

                        note:

                            note,

                        qty:

                            1

                    }

                );

            }


            saveCart();


            document.getElementById(
                "noteModal"
            ).classList.add(
                "hidden"
            );

        };



    /* =========================
       SAVE CART
    ========================== */

    function

    saveCart()

    {

        localStorage.setItem(

            cartKey,

            JSON.stringify(
                cart
            )

        );


        updateCartCount();


        renderCart();

    }



    /* =========================
       CART COUNT
    ========================== */

    function

    updateCartCount()

    {

        const

            count

            =

            cart.reduce(

                (

                    total,

                    item

                )

                =>

                total

                +

                item.qty,

                0

            );


        document.getElementById(
            "cartCount"
        ).textContent

            =

            count;

    }



    /* =========================
       RENDER CART
    ========================== */

    function

    renderCart()

    {

        const

            cartItems

            =

            document.getElementById(
                "cartItems"
            );


        if (

            cart.length

            ===

            0

        )

        {

            cartItems.innerHTML

                =

                `

                <div class="empty">

                    <div class="empty-icon">

                        🛒

                    </div>

                    <h3>

                        ตะกร้ายังว่าง

                    </h3>

                    <p>

                        เลือกเมนูที่คุณต้องการได้เลย

                    </p>

                </div>

                `;

        }

        else

        {

            cartItems.innerHTML

                =

                cart.map(

                    (

                        item,

                        index

                    )

                    =>

                    `

                    <div class="cart-item">


                        <div class="cart-item-top">


                            <div>


                                <div class="cart-item-name">

                                    ${item.name}

                                </div>


                                ${

                                    item.note

                                    ?

                                    `

                                    <span class="cart-note">

                                        ${item.note}

                                    </span>

                                    `

                                    :

                                    ""

                                }


                            </div>


                            <b>

                                ${money(

                                    item.price

                                    *

                                    item.qty

                                )}

                            </b>


                        </div>


                        <div class="quantity-control">


                            <button

                                data-action="minus"

                                data-index="${index}"

                            >

                                −

                            </button>


                            <b>

                                ${item.qty}

                            </b>


                            <button

                                data-action="plus"

                                data-index="${index}"

                            >

                                +

                            </button>


                        </div>


                    </div>

                    `

                )

                .join(
                    ""
                );


            document

                .querySelectorAll(
                    ".quantity-control button"
                )

                .forEach(

                    button

                    =>

                    {

                        button.onclick

                            =

                            () =>

                            {

                                const

                                    index

                                    =

                                    Number(

                                        button.dataset.index
                                    );


                                if (

                                    button.dataset.action

                                    ===

                                    "plus"

                                )

                                {

                                    cart[
                                        index
                                    ].qty

                                        +=

                                        1;

                                }

                                else

                                {

                                    cart[
                                        index
                                    ].qty

                                        -=

                                        1;


                                    if (

                                        cart[
                                            index
                                        ].qty

                                        <=

                                        0

                                    )

                                    {

                                        cart.splice(

                                            index,

                                            1

                                        );

                                    }

                                }


                                saveCart();

                            };

                    }

                );

        }


        const

            total

            =

            cart.reduce(

                (

                    sum,

                    item

                )

                =>

                sum

                +

                (

                    item.price

                    *

                    item.qty

                ),

                0

            );


        document.getElementById(
            "totalPrice"
        ).textContent

            =

            money(
                total
            );

    }



    /* =========================
       CART DRAWER
    ========================== */

    document.getElementById(
        "cartBtn"
    ).onclick

        =

        () =>

        {

            document.getElementById(
                "drawer"
            ).classList.remove(
                "hidden"
            );


            renderCart();

        };



    document.getElementById(
        "closeCart"
    ).onclick

        =

        () =>

        {

            document.getElementById(
                "drawer"
            ).classList.add(
                "hidden"
            );

        };



    /* =========================
       CHECKOUT
    ========================== */

    document.getElementById(
        "checkoutBtn"
    ).onclick

        =

        async () =>

        {

            if (

                cart.length

                ===

                0

            )

            {

                alert(
                    "กรุณาเลือกอาหารก่อน"
                );

                return;

            }


            const

                total

                =

                cart.reduce(

                    (

                        sum,

                        item

                    )

                    =>

                    sum

                    +

                    (

                        item.price

                        *

                        item.qty

                    ),

                    0

                );


            try

            {

                const

                    orderDoc

                    =

                    await addDoc(

                        collection(

                            db,

                            "orders"

                        ),

                        {

                            table:

                                String(
                                    table
                                ),

                            items:

                                cart,

                            total:

                                total,

                            status:

                                "new",

                            paymentStatus:

                                "unpaid",

                            createdAt:

                                serverTimestamp()

                        }

                    );


                localStorage.removeItem(
                    cartKey
                );


                location.href

                    =

                    `order.html?id=${

                        orderDoc.id

                    }`;

            }

            catch (

                error

            )

            {

                console.error(
                    error
                );


                alert(

                    "ไม่สามารถส่งออเดอร์ได้ กรุณาตรวจสอบ Firebase"

                );

            }

        };



    /* =========================
       START
    ========================== */

    renderCategories();


    renderMenu();


    updateCartCount();


    renderCart();


</script>
