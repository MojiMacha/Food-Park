<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ชำระเงิน</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body>
<header class="topbar"><b>💳 ชำระเงิน</b><a id="backLink">กลับ</a></header>
<main class="narrow">
 <section class="payment-card">
   <h1>สแกนเพื่อชำระเงิน</h1>
   <p>ยอดชำระ</p><div class="price" id="amount">฿0</div>
   <div class="qr-wrap"><div id="qr"></div></div>
   <p class="muted">QR นี้สำหรับแสดงตัวอย่างระบบรับเงิน กรุณาตั้งค่า PromptPay/Payment Gateway ก่อนใช้เงินจริง</p>
   <div class="timer">⏱ เหลือ <b id="timer">10:00</b></div>
   <button class="primary full" id="paidBtn">ฉันชำระเงินแล้ว</button>
 </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script type="module" src="assets/js/payment.js"></script>
</body></html>
