<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Restaurant</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="center-page">
<div class="landing">
  <div class="logo">🍽️</div>
  <h1>QR Restaurant</h1>
  <p>สแกน QR Code ที่โต๊ะเพื่อสั่งอาหาร</p>
  <div class="card">
    <label>ทดลองเลือกรหัสโต๊ะ</label>
    <input id="tableInput" type="number" min="1" placeholder="เช่น 5">
    <button id="goBtn">เข้าสู่เมนู</button>
  </div>
  <a class="staff-link" href="staff/login.html">สำหรับพนักงาน →</a>
</div>
<script>
document.getElementById('goBtn').onclick=()=>{
 const t=document.getElementById('tableInput').value;
 if(t) location.href='customer.html?table='+encodeURIComponent(t);
};
</script>
</body></html>
